base: '%env(HOST_PORTAL)%'
dependencies:
  - sitepackage/MainPortal
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
  -
    title: German
    enabled: true
    locale: de_DE.UTF-8
    hreflang: de
    base: /de/
    websiteTitle: ''
    navigationTitle: ''
    fallbackType: fallback
    fallbacks: ''
    flag: de
    languageId: 1
rootPageId: 1
routeEnhancers:
  PageTypeSuffix:
    type: PageType
    map:
      /: 0
      sitemap.xml: 1533906435
  News:
    type: Extbase
    extension: News
    plugin: Pi1
    routes:
      -
        routePath: '/{news-title}'
        _controller: 'News::detail'
        _arguments:
          news-title: news
    aspects:
      news-title:
        type: NewsTitle
websiteTitle: 'TYPO3 GovStack Sandbox: Main portal'
