base: '%env(HOST_UNIVERSITY)%'
dependencies:
  - sitepackage/university
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=132'
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: 'EN'
    flag: us
  -
    title: German
    enabled: true
    locale: de_DE.UTF-8
    hreflang: de
    base: /de/
    websiteTitle: 'Universität'
    navigationTitle: 'DE'
    fallbackType: fallback
    fallbacks: '0'
    flag: de
    languageId: 1
rootPageId: 93
routeEnhancers:
  PageTypeSuffix:
    type: PageType
    map:
      /: 0
      sitemap.xml: 1533906435
  News:
    type: Extbase
    extension: News
    plugin: Pi1
    routes:
      - routePath: '/{news-title}'
        _controller: 'News::detail'
        _arguments:
          news-title: news
    aspects:
      news-title:
        type: NewsTitle
websiteTitle: 'TYPO3 GovStack Sandbox: University example'
