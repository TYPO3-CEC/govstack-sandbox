apiVersion: apps/v1
kind: Deployment
metadata:
  name: typo3
  namespace: cms-govstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: typo3
  template:
    metadata:
      labels:
        app: typo3
    spec:
      imagePullSecrets:
        - name: regcred
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-app
          image: <registry>/typo3/typo3-app:13
          command:
            - /bin/sh
            - -lc
            - tar -xzf /artifact/typo3.tar.gz -C /var/www && mv /var/www/typo3 /var/www/html && chown -R 1000:1000 /var/www/html
          volumeMounts:
            - name: app
              mountPath: /var/www
      containers:
        - name: php-fpm
          image: <registry>/typo3/typo3-php-fpm:13-php83
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: fpm
          env:
            - name: DB_DRIVER
              value: mysqli
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: typo3
            - name: DB_USER
              value: typo3
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: redis.cms-govstack.svc.cluster.local
            - name: TYPO3_CONTEXT
              value: Production
            - name: TRUSTED_HOSTS_PATTERN
              value: ^([a-z0-9-]+)\.cms\.assembly\.govstack\.global$
            - name: TRUSTED_PROXY_IPS
              value: 10.0.0.0/24,10.255.0.0/24
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: app
              mountPath: /var/www/html
            - name: files
              mountPath: /var/www/html/public/fileadmin
            - name: var
              mountPath: /var/www/html/var
            - name: tmp
              mountPath: /var/www/html/public/typo3temp
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: app
              mountPath: /var/www/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: site-typo3.conf
      volumes:
        - name: app
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: files
          persistentVolumeClaim:
            claimName: files-pvc
        - name: var
          persistentVolumeClaim:
            claimName: var-pvc
        - name: tmp
          persistentVolumeClaim:
            claimName: typo3temp-pvc
