apiVersion: v1
data:
  nginx.conf: |
    worker_processes auto;
    pid /var/run/nginx/nginx.pid;
    events { worker_connections 2048; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on; tcp_nopush on; tcp_nodelay on;
      keepalive_timeout 65; client_max_body_size 64m;
      access_log /proc/self/fd/1; error_log /proc/self/fd/2;
      include /etc/nginx/conf.d/*.conf;
    }
  site-typo3.conf: |
    server {
      listen 8080 default_server;
      server_name _;
      root /var/www/html/public;
      index index.php index.html;

      location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

      location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ { access_log off; expires 30d; try_files $uri =404; }
      location ~* /(config|var|vendor|composer\.(json|lock)|\.env) { deny all; }
      location ~ /\. { deny all; }

      location / { try_files $uri /index.php$is_args$args; }

      location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param DOCUMENT_ROOT  $realpath_root;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300s;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
      }

      location = /fpm-ping {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
      }
    }
kind: ConfigMap
