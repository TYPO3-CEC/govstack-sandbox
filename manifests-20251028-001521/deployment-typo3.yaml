      - command:
        - /bin/sh
        - -lc
        - 'set -Eeuo pipefail; apk add --no-cache git openssh-client rsync curl; mkdir
          -p /tmp/ssh; cp /root/.ssh/id_ed25519 /tmp/ssh/id_ed25519; chmod 600 /tmp/ssh/id_ed25519;
          if [ -f /root/.ssh/known_hosts ]; then cp /root/.ssh/known_hosts /tmp/ssh/known_hosts;
          else ssh-keyscan -t rsa,ecdsa,ed25519 github.com > /tmp/ssh/known_hosts;
          fi; export GIT_SSH_COMMAND="ssh -i /tmp/ssh/id_ed25519 -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/ssh/known_hosts";
