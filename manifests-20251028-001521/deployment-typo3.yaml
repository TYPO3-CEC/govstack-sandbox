        app: typo3
    spec:
      containers:
      - args:
        - |-
          set -e
          cat >/usr/local/etc/php-fpm.d/zzz-sock.conf <<CONF
          [www]
          user = 1000
          group = 1000
          listen = /var/run/php/php-fpm.sock
          listen.owner = 1000
          listen.group = 1000
          listen.mode  = 0660
          catch_workers_output = yes
          php_admin_flag[log_errors] = on
          php_admin_value[error_log] = /proc/self/fd/2
          CONF

          echo "cgi.fix_pathinfo=1" > /usr/local/etc/php/conf.d/zz-fpm.ini
          php-fpm -tt | head -n 50
          php-fpm -F
        command:
        - /bin/sh
        - -lc
        env:
        - name: PHP_DISPLAY_ERRORS
          value: "0"
        image: php:8.3-fpm
        imagePullPolicy: IfNotPresent
        name: php-fpm
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -lc
            - '[ -S /var/run/php/php-fpm.sock ]'
          failureThreshold: 3
          initialDelaySeconds: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/www/html
          name: app
        - mountPath: /var/run/php
          name: php-run
      - image: nginx:1.28.0-alpine
        imagePullPolicy: IfNotPresent
        name: nginx
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 1000
          runAsUser: 1000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/www/html
          name: app
          readOnly: true
        - mountPath: /var/run/php
          name: php-run
          readOnly: true
        - mountPath: /etc/nginx/nginx.conf
          name: nginx-conf
          readOnly: true
          subPath: nginx.conf
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx-conf
          readOnly: true
          subPath: site-typo3.conf
        - mountPath: /var/cache/nginx
          name: nginx-cache
        - mountPath: /var/run/nginx
          name: nginx-run
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - -lc
        - set -e; mkdir -p /var/cache/nginx/client_temp /var/run/nginx; chown -R 1000:1000
          /var/cache/nginx /var/run/nginx || true
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
