          > /var/www/html/.env; fi; echo "===== /var/www/html/.env ====="; cat /var/www/html/.env
          || true; echo "==============================="; test -f /var/www/html/public/index.php
          || { echo "FATAL: brak /var/www/html/public/index.php"; ls -la /var/www/html/public
          || true; exit 3; }'
        env:
        - name: GIT_REF
          value: main
        image: php:8.3-cli-alpine
        imagePullPolicy: IfNotPresent
        name: composer-bootstrap
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/www/html
          name: app
        - mountPath: /root/.ssh
          name: ssh-key
      - command:
        - /bin/sh
        - -lc
        - set -e; mkdir -p /var/www/html/var/log /var/www/html/public/fileadmin /var/www/html/public/typo3temp;
          chown -R 1000:1000 /var/www/html/var /var/www/html/public/fileadmin /var/www/html/public/typo3temp;
          chmod -R 2775 /var/www/html/var /var/www/html/public/fileadmin /var/www/html/public/typo3temp;
          find /var/www/html/var -maxdepth 1 -type d -exec ls -ld {} + || true
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: fix-perms
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/www/html
          name: app
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: app
      - emptyDir: {}
        name: php-run
      - configMap:
          defaultMode: 420
          name: nginx-conf
        name: nginx-conf
      - emptyDir: {}
        name: nginx-cache
      - emptyDir: {}
        name: nginx-run
      - name: ssh-key
