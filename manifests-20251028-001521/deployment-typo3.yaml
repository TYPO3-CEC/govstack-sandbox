          /tmp/repo; curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin
          --filename=composer; cd /tmp/repo; COMPOSER_ALLOW_SUPERUSER=1 composer install
          --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
          --ignore-platform-req=ext-intl; rsync -a /tmp/repo/ /var/www/html/ --exclude=public/fileadmin
          --exclude=public/typo3temp --exclude=var; if [ -f /tmp/app-dotenv/.env ];
          then cp /tmp/app-dotenv/.env /var/www/html/.env; else printf "HOST_PORTAL=%s\nHOST_INSTITUTION=%s\n"
